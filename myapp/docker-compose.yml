version: '3.8'

services:
  backend:
    build: ./appback
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./appback:/app/backend
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - DEMO_MODE=True
    restart: unless-stopped

  frontend:
    build: ./my-app
    command: npm run dev
    volumes:
      - ./my-app:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api/
      INTERNAL_API_URL: http://backend:8000/api/
      NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-false}
      NEXTAUTH_URL: http://localhost:3001
      NEXT_PUBLIC_NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: pYn8r7yQW5A3vB8N2mK9j6T1uR0eL4sX
      AUTH_TRUST_HOST: "true"
    depends_on:
      - backend
    restart: unless-stopped
